<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富能512 點名工具</title>
<style>
:root {
--bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --line:#e5e7eb;
--green:#166534; --greenbg:#dcfce7; --amber:#92400e; --amberbg:#fef3c7;
--red:#991b1b; --redbg:#fee2e2; --purple:#5b21b6; --purplebg:#ede9fe;
--blue:#2563eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 14px 110px}
h1{font-size:24px;margin:2px 0 8px}
.sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.stat{background:#f8fafc;border-radius:12px;padding:9px 4px;text-align:center;font-size:12px;color:var(--muted)}
.stat b{display:block;color:var(--text);font-size:21px;margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:800}
.mode.active[data-mode="present"]{background:var(--greenbg);color:var(--green)}
.mode.active[data-mode="late"]{background:var(--amberbg);color:var(--amber)}
.mode.active[data-mode="absent"]{background:var(--redbg);color:var(--red)}
.mode.active[data-mode="leave"]{background:var(--purplebg);color:var(--purple)}
.hint{font-size:13px;color:var(--muted);margin-top:9px}
.person{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f2f5;padding:9px 0}
.name{flex:1;font-weight:750;font-size:17px;padding:7px 3px;cursor:pointer}
.badge{min-width:98px;text-align:center;border-radius:999px;padding:8px 10px;font-size:14px;font-weight:800;cursor:pointer}
.unset{background:#f1f5f9;color:#64748b}
.present{background:var(--greenbg);color:var(--green)}
.late{background:var(--amberbg);color:var(--amber)}
.absent{background:var(--redbg);color:var(--red)}
.leave{background:var(--purplebg);color:var(--purple)}
.divider{text-align:center;font-weight:900;background:#eef2f7;color:#334155;border-radius:12px;padding:11px;margin:8px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-weight:800}
.dark{background:#111827;color:#fff;border-color:#111827}
.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
pre{white-space:pre-wrap;word-break:break-word;margin:0;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.6;font-size:15px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.stickyin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.big{border:0;border-radius:14px;padding:14px 10px;font-weight:900;font-size:16px}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal{max-width:760px;width:100%;background:#fff;border-radius:20px;padding:16px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.quick button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 5px;font-weight:750}
.hidden{display:none!important}
input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit}
.row{display:flex;gap:8px}
.memory{display:flex;align-items:center;justify-content:space-between;gap:10px}
.memory .left{font-size:13px;color:var(--muted)}
.memory strong{color:var(--text)}
@media(max-width:480px){
.stats{grid-template-columns:repeat(3,1fr)}
.modes{grid-template-columns:repeat(2,1fr)}
}

.month-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.month-grid section{background:#f8fafc;border-radius:12px;padding:12px;min-width:0}
h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}
.person-link{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}
#personDetail{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px}
#personDetail li{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
#historyMessage{white-space:pre-wrap;line-height:1.6}
button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
@media(max-width:480px){.month-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>🌟 富能512｜點名工具</h1>
<div class="sub">這台手機會自動保留上一次點名結果，下次打開可直接修改。</div>
<div class="card">
<label for="recordDate">點名日期</label>
<input type="date" id="recordDate">
<div class="actions"><button class="btn blue" id="saveDay">儲存今日點名</button><button class="btn" id="showMonthly">📊 月統計</button></div>
<div class="hint">上次點名會保留在畫面，請核對日期與所有人的狀態後再儲存。月統計只計入已儲存的點名日。</div>
<div id="historyMessage" class="hint" role="status" aria-live="polite"></div>
</div>
<div class="card hidden" id="monthlyPanel">
<h2>📊 月統計</h2>
<label for="reportMonth">選擇月份</label><input type="month" id="reportMonth">
<p class="hint">全勤＝當月所有已記錄點名日都是 ✅準時。有遲到、請假、未到或缺少紀錄，均不算全勤。</p>
<p class="hint">資料僅儲存在此手機的此瀏覽器；清除網站資料後，紀錄也會消失。</p>
<p id="monthSummary" role="status"></p>
<div id="monthResults"></div>
<div id="personDetail" class="hidden" tabindex="-1"></div>
</div>
<div class="card memory">
<div class="left">上次保存：<strong id="savedAt">尚未保存</strong></div>
<button class="btn" id="clearMemory">清除記憶</button>
</div>
<div class="card">
<div class="stats">
<div class="stat">✅準時<b id="nPresent">0</b></div>
<div class="stat">⏰遲到<b id="nLate">0</b></div>
<div class="stat">❌未到<b id="nAbsent">0</b></div>
<div class="stat">📅請假<b id="nLeave">0</b></div>
<div class="stat">未點名<b id="nUnset">0</b></div>
</div>
</div>
<div class="card">
<div class="modes">
<button class="mode active" data-mode="present">✅ 準時</button>
<button class="mode" data-mode="late">⏰ 遲到</button>
<button class="mode" data-mode="absent">❌ 未到</button>
<button class="mode" data-mode="leave">📅 請假</button>
</div>
<div class="hint">先選狀態，再點姓名。請假可輸入「事假、病假、跑訪、出國9/29-10/6」等文字。</div>
</div>
<div class="card">
<div id="list"></div>
</div>
<div class="card">
<pre id="preview"></pre>
<div class="actions">
<button class="btn dark" id="copy1">複製 LINE 貼文</button>
<button class="btn" id="reset">全部清空</button>
</div>
</div>
</div>
<div class="sticky">
<div class="stickyin">
<button class="big" id="unsetToAbsent">未點名 → 未到</button>
<button class="big dark" id="copy2">複製 LINE 貼文</button>
</div>
</div>
<div id="leaveModal" class="modalbg hidden">
<div class="modal">
<div id="leaveName" style="font-size:18px;font-weight:900">請假註記</div>
<div class="quick">
<button data-note="事假">事假</button>
<button data-note="病假">病假</button>
<button data-note="喪假">喪假</button>
<button data-note="跑訪">跑訪</button>
<button data-note="公假">公假</button>
<button data-note="出國">出國</button>
</div>
<input id="leaveNote" placeholder="例如：出國9/29-10/6">
<div class="row" style="margin-top:10px">
<button class="btn dark" style="flex:1" id="confirmLeave">確定</button>
<button class="btn" style="flex:1" id="cancelLeave">取消</button>
</div>
</div>
</div>
<script>
const STORAGE_KEY = "funeng512_last_attendance_v3";
const BASE = [{"type": "person", "name": "簡宏鈞"}, {"type": "person", "name": "林思宇"}, {"type": "person", "name": "柯如真"}, {"type": "person", "name": "邱俊睿"}, {"type": "person", "name": "張齊祐"}, {"type": "person", "name": "李聖喆"}, {"type": "person", "name": "洪鈺茹"}, {"type": "person", "name": "劉文軒"}, {"type": "person", "name": "林龍杉"}, {"type": "person", "name": "劉芷珊"}, {"type": "person", "name": "簡姵萱"}, {"type": "person", "name": "李兆傳"}, {"type": "person", "name": "邢涵瑜"}, {"type": "person", "name": "連庭君"}, {"type": "person", "name": "李育萱"}, {"type": "person", "name": "葉欲聖"}, {"type": "person", "name": "許慶安"}, {"type": "person", "name": "劉凱綸"}, {"type": "person", "name": "林奕安"}, {"type": "person", "name": "陳子杰"}, {"type": "person", "name": "趙家詡"}, {"type": "person", "name": "吳虹儀"}, {"type": "person", "name": "于柏鋒"}, {"type": "person", "name": "劉峻孝"}, {"type": "person", "name": "李婕詠"}, {"type": "person", "name": "陳冠綸"}, {"type": "person", "name": "陳彥朋"}, {"type": "person", "name": "吳沛錞"}, {"type": "person", "name": "胡湘祺"}, {"type": "person", "name": "林芳誼"}, {"type": "person", "name": "李若瑜"}, {"type": "person", "name": "許家銘"}, {"type": "person", "name": "顏明儀"}, {"type": "person", "name": "李宗騏"}, {"type": "person", "name": "黃啟傑"}, {"type": "person", "name": "張國興"}, {"type": "person", "name": "李劭圻"}, {"type": "person", "name": "蔡承遠"}, {"type": "divider", "text": "——8:30、9:00上班——"}, {"type": "person", "name": "陳昶宇"}, {"type": "person", "name": "陳昶安"}, {"type": "person", "name": "陳柏翰"}, {"type": "person", "name": "管卓鈞"}, {"type": "person", "name": "王思嵐"}, {"type": "person", "name": "姚恩廸"}, {"type": "person", "name": "邵建文"}, {"type": "person", "name": "潘韻竹"}, {"type": "person", "name": "曾柏郡"}, {"type": "person", "name": "程綺婕"}, {"type": "person", "name": "王思瑩（台南）"}];
const $ = id => document.getElementById(id);
function blankState() {
return BASE.map(x => x.type==="person" ? {...x,status:"",note:""} : {...x});
}
function loadState() {
try {
const raw = localStorage.getItem(STORAGE_KEY);
if (!raw) return {items: blankState(), savedAt: null};
const parsed = JSON.parse(raw);
if (!parsed || !Array.isArray(parsed.items)) return {items: blankState(), savedAt: null};
return parsed;
} catch(e) {
return {items: blankState(), savedAt: null};
}
}
let store = loadState();
let state = store.items;
let mode = "present";
let leaveIndex = null;
function save() {
const now = new Date();
store = {items: state, savedAt: now.toISOString()};
try {
localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
} catch(e) {
$("savedAt").textContent = "保存失敗";
alert("無法保存本機記憶，請確認瀏覽器允許儲存且空間足夠。");
return;
}
updateSavedAt();
}
function updateSavedAt() {
if (!store.savedAt) {
$("savedAt").textContent = "尚未保存";
return;
}
const d = new Date(store.savedAt);
$("savedAt").textContent = d.toLocaleString("zh-TW", {
month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"
});
}
function statusText(item) {
if (!item.status) return ["未點名","unset"];
if (item.status==="present") return ["✅ 準時","present"];
if (item.status==="late") return ["⏰ 遲到","late"];
if (item.status==="absent") return ["❌ 未到","absent"];
return ["📅 "+(item.note || "請假"),"leave"];
}
function apply(index, status) {
const item = state[index];
if (status==="leave") {
leaveIndex = index;
$("leaveName").textContent = item.name + "｜請假註記";
$("leaveNote").value = item.status==="leave" ? (item.note || "") : "";
$("leaveModal").classList.remove("hidden");
return;
}
item.status = status;
item.note = "";
save();
render();
}
function buildPost() {
const out = ["✅準時⏰遲到❌未到","📅請假（標記假別）",""];
state.forEach(item => {
if (item.type==="divider") {
out.push("", item.text);
return;
}
let suffix = "";
if (item.status==="present") suffix = "✅";
else if (item.status==="late") suffix = "⏰";
else if (item.status==="absent") suffix = "❌";
else if (item.status==="leave") suffix = "📅" + (item.note || "請假");
out.push(item.name + suffix);
});
return out.join("\n");
}
function render() {
$("list").innerHTML = "";
state.forEach((item,index) => {
if (item.type==="divider") {
const d = document.createElement("div");
d.className = "divider";
d.textContent = item.text;
$("list").appendChild(d);
return;
}
const [label, cls] = statusText(item);
const row = document.createElement("div");
row.className = "person";
row.innerHTML = '<div class="name"></div><div class="badge"></div>';
row.querySelector(".name").textContent = item.name;
const badge = row.querySelector(".badge");
badge.textContent = label;
badge.className = "badge " + cls;
row.querySelector(".name").onclick = () => apply(index, mode);
badge.onclick = () => {
const order = ["","present","late","absent","leave"];
const cur = order.indexOf(item.status || "");
const next = order[(cur+1)%order.length];
if (next==="leave") return apply(index,"leave");
item.status = next;
item.note = "";
save();
render();
};
$("list").appendChild(row);
});
const people = state.filter(x=>x.type==="person");
$("nPresent").textContent = people.filter(x=>x.status==="present").length;
$("nLate").textContent = people.filter(x=>x.status==="late").length;
$("nAbsent").textContent = people.filter(x=>x.status==="absent").length;
$("nLeave").textContent = people.filter(x=>x.status==="leave").length;
$("nUnset").textContent = people.filter(x=>!x.status).length;
$("preview").textContent = buildPost();
updateSavedAt();
}
document.querySelectorAll(".mode").forEach(btn => {
btn.onclick = () => {
document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
mode = btn.dataset.mode;
};
});
$("unsetToAbsent").onclick = () => {
if (!confirm("把所有尚未點名的人改成 ❌ 未到？")) return;
state.forEach(x => { if (x.type==="person" && !x.status) x.status="absent"; });
save();
render();
};
$("reset").onclick = () => {
if (!confirm("清空畫面上的點名結果？已儲存的每日紀錄不會刪除。")) return;
state = blankState();
save();
render();
};
$("clearMemory").onclick = () => {
if (!confirm("清除上次點名的本機記憶？已儲存的每日紀錄不會刪除。")) return;
localStorage.removeItem(STORAGE_KEY);
store = {items: blankState(), savedAt: null};
state = store.items;
render();
};
document.querySelectorAll("[data-note]").forEach(btn => {
btn.onclick = () => { $("leaveNote").value = btn.dataset.note; $("leaveNote").focus(); };
});
$("confirmLeave").onclick = () => {
if (leaveIndex===null) return;
state[leaveIndex].status = "leave";
state[leaveIndex].note = $("leaveNote").value.trim() || "請假";
leaveIndex = null;
$("leaveModal").classList.add("hidden");
save();
render();
};
$("cancelLeave").onclick = () => {
leaveIndex = null;
$("leaveModal").classList.add("hidden");
};
async function copyText() {
const text = buildPost();
try {
await navigator.clipboard.writeText(text);
alert("已複製，可以直接貼到 LINE。");
} catch(e) {
const ta = document.createElement("textarea");
ta.value = text;
ta.style.position = "fixed";
ta.style.opacity = "0";
document.body.appendChild(ta);
ta.focus(); ta.select();
document.execCommand("copy");
ta.remove();
alert("已複製，可以直接貼到 LINE。");
}
}
$("copy1").onclick = copyText;
$("copy2").onclick = copyText;
const HISTORY_KEY = "funeng512_daily_attendance_v1";
const VALID_STATUSES = ["present", "late", "absent", "leave"];
function localDate() {
const d = new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function validDate(date) {
if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
const d = new Date(date + "T12:00:00");
return !isNaN(d) && d.getFullYear() === Number(date.slice(0,4)) && d.getMonth()+1 === Number(date.slice(5,7)) && d.getDate() === Number(date.slice(8,10));
}
function readHistory() {
const raw = localStorage.getItem(HISTORY_KEY);
if (!raw) return {version:1, days:{}};
const data = JSON.parse(raw);
if (!data || data.version !== 1 || !data.days || typeof data.days !== "object" || Array.isArray(data.days)) throw new Error("Invalid history");
for (const [date, day] of Object.entries(data.days)) {
if (!validDate(date) || !day || !Array.isArray(day.people) || !day.people.length) throw new Error("Invalid day");
const names = new Set();
for (const p of day.people) {
if (!p || typeof p.name !== "string" || !p.name || names.has(p.name) || !VALID_STATUSES.includes(p.status) || typeof p.note !== "string") throw new Error("Invalid person");
names.add(p.name);
}
}
return data;
}
function monthlyStats(history, month) {
const days = Object.keys(history.days).filter(d=>d.startsWith(month+"-")).sort();
const people = new Map();
for (const date of days) {
for (const p of history.days[date].people) {
if (!people.has(p.name)) people.set(p.name, {name:p.name,present:0,late:0,absent:0,leave:0,recorded:0,leaves:[]});
const row = people.get(p.name);
row[p.status]++;
row.recorded++;
if (p.status === "leave") row.leaves.push({date,note:p.note});
}
}
return {days,people:[...people.values()].map(p=>({...p,perfect:days.length>0 && p.present===days.length}))};
}
function message(text) { $("historyMessage").textContent = text; }
$("recordDate").value = localDate();
$("reportMonth").value = localDate().slice(0,7);
$("recordDate").onchange = () => message("已切換日期；畫面仍保留目前點名，儲存前請核對。");
$("saveDay").onclick = () => {
const date = $("recordDate").value;
if (!validDate(date) || date > localDate()) return message("請選擇有效的點名日期，不能儲存未來日期。");
const people = state.filter(p=>p.type==="person");
if (!people.length || people.some(p=>!VALID_STATUSES.includes(p.status))) return message("尚有人未點名，請全部點完再儲存；也可以使用「未點名 → 未到」。");
let history;
try { history = readHistory(); }
catch(e) { return message("無法讀取每日紀錄，為避免覆蓋資料，本次未儲存。請確認瀏覽器允許本機儲存。"); }
if (history.days[date] && !confirm(`${date} 已有紀錄，要用目前畫面覆寫該日紀錄嗎？`)) return;
history.days[date] = {savedAt:new Date().toISOString(),people:people.map(p=>({name:p.name,status:p.status,note:p.note || ""}))};
try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
catch(e) { return message("儲存失敗，請確認瀏覽器允許本機儲存且空間足夠。原有每日紀錄未變更。"); }
message(`已儲存 ${date}，共 ${people.length} 人。之後修改畫面時，請再次儲存才會更新每日紀錄。`);
$("reportMonth").value = date.slice(0,7);
renderMonthly();
};
function personButton(p, label, report) {
const b = document.createElement("button");
b.className = "btn person-link";
b.textContent = label;
b.onclick = () => showPerson(p, report);
return b;
}
function showPerson(p, report) {
const detail = $("personDetail");
detail.replaceChildren();
detail.classList.remove("hidden");
const heading = document.createElement("h3");
heading.textContent = `${p.name}｜${$("reportMonth").value}`;
const counts = document.createElement("p");
counts.textContent = `已記錄點名日 ${report.days.length} 天｜✅準時 ${p.present}｜📅請假 ${p.leave}｜⏰遲到 ${p.late}｜❌未到 ${p.absent}｜缺少紀錄 ${report.days.length-p.recorded}`;
detail.append(heading, counts);
const title = document.createElement("h3");
title.textContent = "每次請假的日期與理由";
detail.append(title);
if (!p.leaves.length) {
const empty = document.createElement("p"); empty.textContent = "本月沒有請假紀錄。"; detail.append(empty);
} else {
const list = document.createElement("ul");
for (const leave of p.leaves) { const li = document.createElement("li"); li.textContent = `${leave.date}：${leave.note || "未填寫理由"}`; list.append(li); }
detail.append(list);
}
detail.focus();
}
function renderMonthly() {
$("monthResults").replaceChildren();
$("personDetail").classList.add("hidden");
let history;
try { history = readHistory(); }
catch(e) { $("monthSummary").textContent = "無法讀取每日紀錄，原資料未被覆寫。"; return; }
const month = $("reportMonth").value;
if (!/^\d{4}-\d{2}$/.test(month)) { $("monthSummary").textContent = "請選擇月份。"; return; }
const report = monthlyStats(history, month);
$("monthSummary").textContent = report.days.length ? `${month}｜已記錄 ${report.days.length} 個點名日（${report.days.join("、")}）。點姓名查看請假明細。` : "這個月尚無已儲存的點名紀錄。";
if (!report.days.length) return;
const grid = document.createElement("div"); grid.className = "month-grid";
for (const [title,key] of [["🏆 全勤名單","perfect"],["📅 請假最多","leave"],["⏰ 遲到最多","late"],["❌ 未到最多","absent"]]) {
const section = document.createElement("section");
const heading = document.createElement("h3"); heading.textContent = title; section.append(heading);
const rows = report.people.filter(p=>p[key]).sort((a,b)=>Number(b[key])-Number(a[key]) || a.name.localeCompare(b.name,"zh-Hant"));
if (!rows.length) { const empty = document.createElement("p"); empty.textContent = key==="perfect" ? "本月目前無全勤人員。" : "本月無此狀態紀錄。"; section.append(empty); }
for (const p of rows) section.append(personButton(p, `${p.name}　${key==="perfect" ? `${p.present}/${report.days.length} 天` : `${p[key]} 次`}`, report));
grid.append(section);
}
$("monthResults").append(grid);
const all = document.createElement("details");
const summary = document.createElement("summary"); summary.textContent = `所有人員（${report.people.length} 人）`; all.append(summary);
for (const p of report.people) all.append(personButton(p,p.name,report));
$("monthResults").append(all);
}
$("showMonthly").onclick = () => {
$("monthlyPanel").classList.toggle("hidden");
if (!$("monthlyPanel").classList.contains("hidden")) { renderMonthly(); $("monthlyPanel").scrollIntoView({behavior:"smooth",block:"start"}); }
};
$("reportMonth").onchange = renderMonthly;

render();
</script>
</body>
</html>
