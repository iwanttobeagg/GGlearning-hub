name: Update investment fund data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-investment-income.yml'
      - 'tools/investment-income/update_data.py'
      - 'tools/investment-income/test_update_data.py'
      - 'tools/investment-income/fubon-fixtures.json'
  schedule:
    # 10:00 UTC = 18:00 Asia/Taipei, every day
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  refresh-funds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Test fund parser
        run: python -m unittest discover -s tools/investment-income -p 'test_*.py'

      - name: Refresh fund NAV and distributions
        run: python tools/investment-income/update_data.py --funds-only

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/investment-income/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update investment fund data"
            git push
          fi

      - name: Verify all funds refreshed successfully
        run: |
          python - <<'PYCODE'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/investment-income')
          from update_data import FUNDS
          data = json.loads(Path('tools/investment-income/data.json').read_text())
          if data.get('refresh_status') != 'ok' or data.get('refresh_errors'):
              raise SystemExit(f"Fund refresh failed: {data.get('refresh_errors')}")
          for code in FUNDS:
              fund = data['funds'][code]
              for kind in ('nav', 'distribution'):
                  if fund.get(f'{kind}_updated_at') != data['funds_updated_at']:
                      raise SystemExit(f'{code} {kind} was not refreshed in this run')
                  print(f'{code} {kind}: {fund[kind]} ({fund[kind + "_date"]})')
          PYCODE
