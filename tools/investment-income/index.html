<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投資型保單月配息試算器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f6f7fb;margin:0;color:#1f2937}.w{max-width:760px;margin:auto;padding:20px}.c{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.g{grid-template-columns:1fr}}label{font-weight:700;display:block;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{padding:12px;border-radius:10px;border:1px solid #d1d5db;background:white;font-weight:800}.tabs .a{background:#2563eb;color:white}.r{font-size:28px;font-weight:900;color:#0f766e}.muted{color:#6b7280;font-size:13px;line-height:1.5}.hidden{display:none}.kv{padding:10px;background:#fafafa;border-radius:10px}.kv b{display:block;font-size:20px;margin-top:4px}</style></head><body><div class="w"><h1>投資型保單月配息試算器</h1><div class="tabs"><button id="t1" class="a" onclick="mode('f')">本金 → 月配息</button><button id="t2" onclick="mode('r')">月配息 → 所需本金</button></div><div class="c"><label>選擇標的</label><select id="fund"></select><div class="g" style="margin-top:12px"><div class="kv">最新淨值<b id="navv">—</b><span class="muted" id="navd"></span></div><div class="kv">最新每單位配息<b id="distv">—</b><span class="muted" id="distd"></span></div><div class="kv">美元匯率（即期賣出）<b id="fxv">—</b><span class="muted" id="fxd"></span></div><div class="kv">資料更新<b id="upd">—</b></div></div></div><section id="forward"><div class="c"><label>投入金額（新台幣）</label><input id="amt" type="number" placeholder="例如 3000000"></div><div class="c g"><div class="kv">手續費率<b id="fr">—</b></div><div class="kv">扣費後可投資<b id="net">—</b></div><div class="kv">預估單位數<b id="units">—</b></div><div class="kv">預估每月配息<b class="r" id="month">—</b></div></div></section><section id="reverse" class="hidden"><div class="c"><label>希望每月配息（新台幣）</label><input id="target" type="number" placeholder="例如 60000"></div><div class="c"><div class="muted">預估需要投入本金</div><div class="r" id="need">—</div><div class="g" style="margin-top:12px"><div class="kv">適用手續費率<b id="rfr">—</b></div><div class="kv">扣費後可投資<b id="rnet">—</b></div></div></div></section><div class="muted">資料來源：公開基金資料與公開匯率 API。實際申購淨值、匯率、配息與費用以保險公司、基金公司及實際交易結果為準，配息並非保證。</div></div><script>let D,F;const $=x=>document.getElementById(x),tiers=[[0,1999999,.05],[2000000,4999999,.04],[5000000,9999999,.03],[10000000,1e99,.02]];function fee(a){return tiers.find(x=>a>=x[0]&&a<=x[1])[2]}function money(x){return Number.isFinite(x)?'NT$ '+Math.round(x).toLocaleString('zh-TW'):'—'}function calc(){if(!F)return;let a=+$('amt').value;if(!(a>=0))return $('month').textContent='—';let r=fee(a),net=a*(1-r),usd=net/D.fx.usd_twd_sell,u=usd/F.nav,m=u*F.distribution*D.fx.usd_twd_buy;$('fr').textContent=(r*100)+'%';$('net').textContent=money(net);$('units').textContent=u.toFixed(2);$('month').textContent=money(m)}function rev(){if(!F)return;let t=+$('target').value;if(!(t>0))return $('need').textContent='—';let needNet=t*F.nav*D.fx.usd_twd_sell/(F.distribution*D.fx.usd_twd_buy),best=Infinity,rr=0;for(const z of tiers){let g=Math.max(needNet/(1-z[2]),z[0]);if(g<=z[1]&&g<best){best=g;rr=z[2]}}$('need').textContent=money(best);$('rfr').textContent=(rr*100)+'%';$('rnet').textContent=money(best*(1-rr))}function pick(){F=D.funds[$('fund').value];$('navv').textContent='US$ '+F.nav;$('navd').textContent='淨值日 '+F.nav_date;$('distv').textContent='US$ '+F.distribution;$('distd').textContent='除息日 '+F.distribution_date;$('fxv').textContent=D.fx.usd_twd_sell.toFixed(3);$('fxd').textContent=(D.fx.updated_at||D.fx.date)+' '+(D.fx.source||'公開匯率')+'・即期賣出';$('upd').textContent=D.updated_at;calc();rev()}function mode(m){$('forward').classList.toggle('hidden',m!=='f');$('reverse').classList.toggle('hidden',m!=='r');$('t1').classList.toggle('a',m==='f');$('t2').classList.toggle('a',m==='r')}fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;for(const [k,v] of Object.entries(d.funds)){let o=document.createElement('option');o.value=k;o.textContent=k+'｜'+v.name;$('fund').appendChild(o)}pick()});$('fund').onchange=pick;$('amt').oninput=calc;$('target').oninput=rev;</script></body></html>
